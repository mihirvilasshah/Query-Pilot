# Render Blueprint for the QueryPilot schema-processing worker.
# The web app is deployed on Vercel; only the .NET worker runs here.
#
# A free web service sleeps after 15 minutes without inbound HTTP traffic, so point an uptime monitor
# (for example UptimeRobot, 5-minute interval) at https://<service>.onrender.com/healthz to keep it polling.
services:
  - type: web
    name: querypilot-schema-processor
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./services/schema-processor/Dockerfile
    dockerContext: ./services/schema-processor
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Render routes traffic to PORT; the worker's health endpoint listens on HEALTH_PORT.
      - key: PORT
        value: "10000"
      - key: HEALTH_PORT
        value: "10000"
      - key: SUPABASE_STORAGE_BUCKET
        value: schema-uploads
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Supabase session pooler (port 5432), e.g.
      # postgresql://postgres.<ref>:<password>@aws-1-eu-west-3.pooler.supabase.com:5432/postgres
      # The direct db.<ref>.supabase.co host is IPv6-only and unreachable from Render.
      - key: DATABASE_URL
        sync: false
